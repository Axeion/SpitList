# Self-hosted shape: app + Postgres on the VPS, native Caddy in front.
#
# Neither service publishes a port to the internet. Caddy reaches the app over
# 127.0.0.1:4321 on the host; Postgres is only reachable from the compose
# network. If you move to Neon, delete the `db` service and the `depends_on`
# block, and point DATABASE_URL at the Neon connection string.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://spitplate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/spitplate}
      N8N_SUBMISSION_WEBHOOK_URL: ${N8N_SUBMISSION_WEBHOOK_URL:-}
      PORT: 4321
    ports:
      - '127.0.0.1:4321:4321'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spitplate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: spitplate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spitplate -d spitplate']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
