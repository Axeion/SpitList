# NOT the deployment target — production runs on Railway (see railway.json).
#
# This file is kept for two things:
#   1. Local development: `docker compose up -d db` for a Postgres instance
#      without installing one.
#   2. The self-hosted VPS fallback: app + Postgres behind native Caddy.
#
# Neither service publishes a port to the internet. Caddy would reach the app
# over 127.0.0.1:4321 on the host; Postgres is only reachable from the compose
# network.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://spitplate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/spitplate}
      N8N_SUBMISSION_WEBHOOK_URL: ${N8N_SUBMISSION_WEBHOOK_URL:-}
      PORT: 4321
    ports:
      - '127.0.0.1:4321:4321'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spitplate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: spitplate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spitplate -d spitplate']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
